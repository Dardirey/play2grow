<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play2Grow | التعلّم باللعب</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header id="site-header" class="header">
            <div class="header-content">
                <div class="brand" onclick="P2G.app.go('home')">
                    <span class="brand-icon">🚀</span>
                    <span class="brand-name" data-i18n="brand">Play2Grow</span>
                </div>
                <nav class="nav" id="top-nav"></nav>
                <div class="header-actions">
                    <button class="lang-btn" id="sound-toggle" onclick="P2G.fx.toggle(); this.textContent = P2G.fx.isEnabled() ? '🔊' : '🔇';">🔊</button>
                    <button class="lang-btn" id="lang-toggle" onclick="P2G.i18n.toggle()">🌍 English</button>
                </div>
            </div>
        </header>
        <main id="main-content"></main>
        <footer class="footer">
            <p data-i18n="footerText">🎓 مشروع التخرج — Play2Grow</p>
        </footer>
    </div>

    <!-- Core -->
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sound.js"></script>
    <!-- Pages -->
    <script src="js/pages/landing.js"></script>
    <script src="js/pages/register.js"></script>
    <script src="js/pages/childselect.js"></script>
    <script src="js/pages/hub.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <!-- Games -->
    <script src="js/games/memory.js"></script>
    <script src="js/games/math.js"></script>
    <script src="js/games/logic.js"></script>
    <script src="js/games/words.js"></script>
    <script src="js/games/creativity.js"></script>
    <script src="js/games/maze.js"></script>
    <script src="js/games/attention.js"></script>
    <script src="js/games/time.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
